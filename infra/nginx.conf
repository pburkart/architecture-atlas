# AB#5009: an anonymous access log, one JSON line per request on stdout (Log Analytics keeps it), read by
# tools/traffic.mjs. Only the minute, the method, the path without its query string, the status and a bot flag:
# no IP address, no user agent, no referrer, no cookie, no header value. The flag is decided here from the user agent,
# which is then thrown away.
map $time_iso8601 $atlas_minute { "~^(?<m>\d{4}-\d\d-\d\dT\d\d:\d\d)" $m; default ""; }
map $http_user_agent $atlas_bot {
  default 0;
  "" 1;
  "~*(bot|crawl|spider|slurp|preview|monitor|probe|scan|check|curl|wget|python|go-http|java/|okhttp|axios|node-fetch|headless|lighthouse|pingdom|uptime)" 1;
}
log_format atlas_anon escape=json '{"t":"$atlas_minute","m":"$request_method","p":"$uri","s":$status,"b":$atlas_bot}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /dev/stdout atlas_anon;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # AB#4984: once the site has its own domain, the old azurecontainerapps.io address sends every path there, kept whole.
  # SITE_DOMAIN comes from the container's environment (the image fills it in at start); empty, nothing moves.
  set $atlas_home "${SITE_DOMAIN}";
  set $atlas_move "";
  if ($host ~* \.azurecontainerapps\.io$) { set $atlas_move "$atlas_home"; }
  # and www sends to the apex (the Board, 2026-10-17: schematica.ca is canonical). Empty SITE_DOMAIN: "www." matches no host
  if ($host = "www.${SITE_DOMAIN}") { set $atlas_move "$atlas_home"; }
  if ($atlas_move) { return 301 https://$atlas_move$request_uri; }

  # Pages change with every build; scripts and styles are loaded with a ?v=<content hash> and can be kept.
  location ~* \.html$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(js|css|svg|png|woff2?)$ { add_header Cache-Control "public, max-age=86400"; add_header X-Content-Type-Options nosniff always; }
  location = /healthz { return 200 "ok\n"; } # logged like any request; tools/traffic.mjs counts only pages
  location / { try_files $uri $uri/ =404; }
}
